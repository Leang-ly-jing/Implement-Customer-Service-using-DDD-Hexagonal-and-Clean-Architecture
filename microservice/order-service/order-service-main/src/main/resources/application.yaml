
spring:
  profiles:
    active: dev
  datasource:
    url: ${URL}
    username: ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  application:
    name: order-service
  config:
    import:
      - "optional:consul:"
  cloud:
    consul:
      discovery:
        prefer-ip-address: true
        health-check-url: http://host.docker.internal:9191/actuator/health

      config:
        format: yaml
        data-key: data
        watch:
          enabled: true

