server:
  port: 9191
spring:
  datasource:
    url: ${URL}
    username: ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  application:
    name: order-service

  cloud:
    consul:
      discovery:
        prefer-ip-address: true
        health-check-url: http://host.docker.internal:9191/actuator/health
