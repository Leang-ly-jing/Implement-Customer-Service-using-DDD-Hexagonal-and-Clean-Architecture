server:
  port: 9191

spring:
  application:
    name: order-service
  mongodb:
    uri: mongodb://mongod:mongod@localhost:2026/order_db?authSource=admin&uuidRepresentation=standard
  data:
    mongodb:
      auto-index-creation: true
      uuid-representation: standard
  cloud:
    consul:
      discovery:
        prefer-ip-address: true
        health-check-url: http://host.docker.internal:9191/actuator/health

