server:
  port: 9393

spring:
  application:
    name: payment-service
  mongodb:
    uri: mongodb://mongod:mongod@localhost:2026/payment_db?authSource=admin&uuidRepresentation=standard
  data:
    mongodb:
      auto-index-creation: true
      uuid-representation: standard
  jackson:
    deserialization:
      fail-on-unknown-properties: true
eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
