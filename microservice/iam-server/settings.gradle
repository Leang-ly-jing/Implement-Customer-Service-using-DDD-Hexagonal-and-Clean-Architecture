pluginManagement {
    includeBuild('../../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
    versionCatalogs {
        create("libs", {
            from(files("../../gradle/libs.versions.toml"))
        })
    }
}
rootProject.name = 'iam-server'
include 'iam-domain'
include 'iam-persistence'
include 'iam-infrastructure'
include 'iam-rest-api'
include 'iam-web'
include 'iam-main'
include 'iam-domain:iam-application-service'
include 'iam-domain:iam-domain-core'