pluginManagement {
    includeBuild('../../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
    versionCatalogs {
        create("libs",{
            from(files("../../gradle/libs.versions.toml"))
        })
    }
}
rootProject.name= 'business-service'
include 'business-service-main'
include 'business-service-domain'
include 'business-service-message'
include 'business-service-persistence'
include 'business-service-restapi'
include 'business-service-domain:business-application-service'
include 'business-service-domain:business-core-domain'





