server:
  port: 9091
  tomcat:
    relaxed-query-chars: '|,<,>,[,],{,}'

spring:
  application:
    name: customer-service
  datasource:
    url: ${URL}
    username: ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  # Move mongodb here:
  mongodb:
    uri: mongodb://mongod:mongod@localhost:2026/customer_db?authSource=admin&uuidRepresentation=standard

  data:
    mongodb:
      auto-index-creation: true
      uuid-representation: standard

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
