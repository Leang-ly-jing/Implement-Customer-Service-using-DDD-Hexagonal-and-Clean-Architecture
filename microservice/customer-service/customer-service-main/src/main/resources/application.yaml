server:
  port: 9090
  tomcat:
    relaxed-query-chars: '|,<,>,[,],{,}'

spring:
  main:
    web-application-type: reactive
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks

  application:
    name: customer-service
  cloud:
    consul:
      discovery:
        prefer-ip-address: true
        health-check-url: http://host.docker.internal:9090/actuator/health

  mongodb:
    uri: mongodb://mongod:mongod@localhost:2026/customer_db?authSource=admin&uuidRepresentation=standard

  data:
    mongodb:
      auto-index-creation: true
      uuid-representation: standard

